<!DOCTYPE html>
<!--
  Deliberately self-contained: all styles are inline and no images are
  referenced. An error page is served under the URL that failed (/a/b/c), so
  relative asset paths would resolve against that URL and break. Keeping this
  page dependency-free means it renders correctly on any host and any depth.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Page Not Found | BayBot Dynamics</title>
    <style>
        :root {
            --blue: #1b5be0;
            --blue-deep: #0b3a8f;
            --ink: #0a1f44;
            --muted: #4a5c7c;
            --line: #e6eefb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            background-color: #fff;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 56px 56px;
            color: var(--muted);
            line-height: 1.65;
            text-align: left;
        }

        main { max-width: 36rem; }

        .code {
            font-size: clamp(5rem, 18vw, 9rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--blue);
        }

        h1 {
            font-size: clamp(1.75rem, 4.5vw, 2.5rem);
            letter-spacing: -0.02em;
            color: var(--ink);
            margin: 1rem 0 0.75rem;
        }

        p { max-width: 34rem; margin: 0 0 2rem; font-size: 1.125rem; }

        .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        a.btn {
            display: inline-block;
            padding: 0.9rem 1.5rem;
            min-height: 48px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            border: 1.5px solid transparent;
            transition: background-color 0.18s ease, color 0.18s ease;
        }

        .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
        .btn-primary:hover { background: var(--blue-deep); border-color: var(--blue-deep); }
        a.btn-outline { color: var(--ink); border-color: var(--ink); }
        .btn-outline:hover { background: var(--ink); color: #fff; }

        a.btn:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            a.btn { transition: none; }
        }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>We couldn't find that page</h1>
        <p>
            The page you're looking for may have moved or no longer exists.
            Let's get you back to something useful.
        </p>
        <div class="actions">
            <a href="/" class="btn btn-primary">Back to Home</a>
            <a href="/contact" class="btn btn-outline">Contact Us</a>
        </div>
    </main>
</body>
</html>
