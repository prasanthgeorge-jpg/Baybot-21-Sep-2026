<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" aria-label="Official Distributor Seal">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="distGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="25%" stop-color="#FFD700"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>

    <!-- Deep Blue/Navy Gradient -->
    <radialGradient id="distNavy" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#122b5c"/>
      <stop offset="65%" stop-color="#0a1f44"/>
      <stop offset="100%" stop-color="#040d1e"/>
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="distShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f2b6b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="distGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Text Arcs -->
    <!-- Top arc: sweeping over the top from left to right -->
    <path id="arcTop" d="M 26 80 A 54 54 0 0 1 134 80" fill="none"/>
    <!-- Bottom arc: sweeping under the bottom from left to right -->
    <path id="arcBottom" d="M 134 80 A 54 54 0 0 1 26 80" fill="none"/>
  </defs>

  <g filter="url(#distGlow)">
    <!-- Outer Rosette / Starburst Ring (16-point notched rim) -->
    <path d="M80.00,2.00 L93.42,14.44 L110.62,8.09 L118.27,24.71 L136.58,25.42 L137.29,43.73 L153.91,51.38 L147.56,68.58 L160.00,82.00 L147.56,95.42 L153.91,112.62 L137.29,120.27 L136.58,138.58 L118.27,139.29 L110.62,155.91 L93.42,149.56 L80.00,162.00 L66.58,149.56 L49.38,155.91 L41.73,139.29 L23.42,138.58 L22.71,120.27 L6.09,112.62 L12.44,95.42 L0.00,82.00 L12.44,68.58 L6.09,51.38 L22.71,43.73 L23.42,25.42 L41.73,24.71 L49.38,8.09 L66.58,14.44 Z" fill="url(#distGold)" transform="scale(0.96) translate(3.3, 1.5)"/>

    <!-- Outer Navy Ring -->
    <circle cx="80" cy="80" r="70" fill="url(#distNavy)"/>
    <circle cx="80" cy="80" r="67.5" fill="none" stroke="url(#distGold)" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="49" fill="none" stroke="url(#distGold)" stroke-width="1.2" stroke-dasharray="2 3"/>

    <!-- Center Field -->
    <circle cx="80" cy="80" r="46" fill="url(#distNavy)" stroke="url(#distGold)" stroke-width="2"/>

    <!-- Circular Typography -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="9.5" font-weight="900" fill="url(#distGold)" letter-spacing="2.6">
      <textPath href="#arcTop" startOffset="50%" text-anchor="middle">OFFICIAL DISTRIBUTOR</textPath>
    </text>

    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="8" font-weight="800" fill="#93c5fd" letter-spacing="3.2">
      <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">&#9733; BAYBOT DYNAMICS &#9733;</textPath>
    </text>

    <!-- Center Certified Shield -->
    <g transform="translate(0, -1)">
      <!-- Shield Body -->
      <path d="M 80 49 L 102 58 C 102 78 80 97 80 99 C 80 97 58 78 58 58 Z" fill="url(#distShield)" stroke="url(#distGold)" stroke-width="2.2" stroke-linejoin="round"/>

      <!-- Shield Inner Rim -->
      <path d="M 80 52.5 L 98.5 60 C 98.5 76 80 93 80 94.5 C 80 93 61.5 76 61.5 60 Z" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>

      <!-- Three Stars in Shield Crest -->
      <g fill="url(#distGold)">
        <!-- Center Star -->
        <polygon points="80,57.5 81.3,61 85,61 82,63.2 83.1,66.8 80,64.6 76.9,66.8 78,63.2 75,61 78.7,61" transform="scale(0.85) translate(14, 8)"/>
        <!-- Left Star -->
        <polygon points="80,57.5 81.3,61 85,61 82,63.2 83.1,66.8 80,64.6 76.9,66.8 78,63.2 75,61 78.7,61" transform="scale(0.65) translate(34, 28)"/>
        <!-- Right Star -->
        <polygon points="80,57.5 81.3,61 85,61 82,63.2 83.1,66.8 80,64.6 76.9,66.8 78,63.2 75,61 78.7,61" transform="scale(0.65) translate(53, 28)"/>
      </g>

      <!-- Bold Certified Checkmark -->
      <path d="M 70 75.5 L 77 82.5 L 90.5 68.5" fill="none" stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bottom Ribbon Notch Accent -->
    <path d="M 72 108 L 80 102 L 88 108 L 80 114 Z" fill="url(#distGold)"/>
  </g>
</svg>