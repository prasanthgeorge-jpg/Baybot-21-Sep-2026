<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 54" width="280" height="54" aria-label="Official Distributor Logo Badge">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>

    <!-- Navy Capsule Gradient -->
    <linearGradient id="badgeNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2652"/>
      <stop offset="50%" stop-color="#0a1f44"/>
      <stop offset="100%" stop-color="#06132b"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="badgeShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10368a"/>
    </linearGradient>

    <!-- Filter for subtle depth -->
    <filter id="badgeShadow" x="-10%" y="-20%" width="125%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- Pill Capsule Container -->
    <rect x="2" y="2" width="276" height="50" rx="25" fill="url(#badgeNavy)" stroke="url(#badgeGold)" stroke-width="1.4"/>
    <!-- Inner subtle glass highlight -->
    <rect x="3.5" y="3.5" width="273" height="47" rx="23.5" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

    <!-- Left Emblem Seal Crest (Center at 27, 27, radius 18) -->
    <g transform="translate(9, 9)">
      <!-- Outer Notched / Rosette ring -->
      <circle cx="18" cy="18" r="17" fill="url(#badgeGold)"/>
      <circle cx="18" cy="18" r="15" fill="url(#badgeNavy)"/>
      <circle cx="18" cy="18" r="14.2" fill="none" stroke="url(#badgeGold)" stroke-width="0.8" stroke-dasharray="1.5 2"/>

      <!-- Center Verified Shield -->
      <path d="M 18 8 L 26 12 C 26 20 18 25.5 18 26.5 C 18 25.5 10 20 10 12 Z" fill="url(#badgeShield)" stroke="url(#badgeGold)" stroke-width="1.2"/>

      <!-- Star over shield -->
      <polygon points="18,10 18.6,11.8 20.5,11.8 19,12.9 19.5,14.7 18,13.6 16.5,14.7 17,12.9 15.5,11.8 17.4,11.8" fill="url(#badgeGold)" transform="scale(0.8) translate(4.5, 2)"/>

      <!-- Checkmark -->
      <path d="M 14 17.5 L 17 20.5 L 22.5 14.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Hairline Separator -->
    <line x1="53" y1="12" x2="53" y2="42" stroke="url(#badgeGold)" stroke-width="1" opacity="0.4"/>

    <!-- Typography Lockup -->
    <!-- Eyebrow: AUTHORISED PARTNER -->
    <text x="64" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="9" font-weight="800" fill="url(#badgeGold)" letter-spacing="1.8">&#9733; AUTHORISED PARTNER</text>

    <!-- Headline: OFFICIAL DISTRIBUTOR -->
    <text x="64" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" letter-spacing="0.8">OFFICIAL DISTRIBUTOR</text>

    <!-- Right End Verification Check pip -->
    <circle cx="253" cy="27" r="9" fill="rgba(255, 215, 0, 0.15)" stroke="url(#badgeGold)" stroke-width="1"/>
    <path d="M 249.5 27 L 252 29.5 L 256.5 24.5" fill="none" stroke="url(#badgeGold)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>